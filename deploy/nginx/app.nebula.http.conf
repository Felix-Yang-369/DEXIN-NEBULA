server {
    listen 80;
    listen [::]:80;
    server_name app.nebula.dexinmiaosheng.cn;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://app.nebula.dexinmiaosheng.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.nebula.dexinmiaosheng.cn;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/app.nebula.dexinmiaosheng.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nebula.dexinmiaosheng.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NEBULA_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://dexin_nebula;
        include /etc/nginx/proxy_params;
    }
}
